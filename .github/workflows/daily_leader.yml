name: 주도주 일일 스크리닝

on:
  schedule:
    # 월~금 09:30 UTC = 18:30 KST (장 마감 후 KRX 확정치 반영)
    - cron: '30 9 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '기준일 (예: 2026-10-07). 비우면 가장 최근 영업일.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt
        
      - name: 테마 캐시 복원
        uses: actions/cache@v4
        with:
          path: .cache
          key: themes-${{ github.run_id }}
          restore-keys: themes-
          
      - name: 스크리닝 및 노션 적재
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # 주도주 스크리닝 (홍인기 단타) DB. ID는 토큰 없이는 쓸모없어 비밀값이 아니다.
          NOTION_LEADER_DB_ID: 2e8f4d3f86e1452b8611b138ba4e13b1
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TZ: Asia/Seoul
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python leader_main.py --date "${{ inputs.date }}"
          else
            python leader_main.py
          fi
