name: 네이버 테마 진단 (일회성)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python tools/naver_diag.py
      - name: 결과를 diag-output 브랜치에 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan diag-output
          git rm -rq --cached . || true
          git add -f diag
          git commit -qm "네이버 진단 결과"
          git push -f origin diag-output
